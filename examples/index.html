<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k-editor デモ</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; background: #fdfdfc; color: #17171a; }
  header { position: sticky; top: 0; z-index: 10; background: #fdfdfc; border-bottom: 1px solid #e4e1da; padding: 12px 16px; font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .k-editor { --k-editor-sticky-top: 45px; --k-editor-bg: #fdfdfc; }
  .label { font-size: 12px; color: #86837c; margin: 28px 0 8px; font-weight: 600; }
  pre#out { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f1ec; padding: 12px; font-size: 13px; border-radius: 2px; min-height: 3em; }
  .fake-embed { border: 1px solid #e4e1da; border-radius: 4px; padding: 14px 44px 14px 14px; font-size: 13px; background: #f7f5f0; }
  .fake-embed b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<header>k-editor デモ（素の HTML）</header>
<main>
  <div id="editor"></div>
  <p class="label">Markdown（保存される形）</p>
  <pre id="out"></pre>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
